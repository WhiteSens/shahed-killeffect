name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build --stacktrace
      - name: show jar contents
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          echo "JAR=$JAR"
          unzip -l "$JAR" | grep -E "shahedkill|fabric.mod.json|\.class"
      - uses: actions/upload-artifact@v7
        with:
          name: shahed-killeffect-jar
          path: build/libs/*.jar
      - name: publish release "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$JAR" \
            --title "Latest build" \
            --notes "Automatic build of the latest commit (${GITHUB_SHA::7}). Download the .jar below and put it in .minecraft/mods together with Fabric API (Minecraft 1.21.11, Fabric Loader 0.20.1+)." \
            --target "$GITHUB_SHA"
